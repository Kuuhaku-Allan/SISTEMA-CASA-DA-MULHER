<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueci minha senha - Casa da Mulher</title>
    <link rel="stylesheet" href="style.css">
    <script src="config.js" defer></script>
    <script src="auth.js" defer></script>
    <script src="app.js" defer></script>
</head>
<body>
    <main class="auth-container">
        <section class="auth-box">
            <img src="IMAGENS/logo_oficial.png" alt="Logo Casa da Mulher" class="logo-login">
            <h1 class="auth-title">Esqueci minha senha</h1>
            <p class="auth-subtitle">Informe seu ID de funcion&aacute;rio para receber as instru&ccedil;&otilde;es no e-mail cadastrado.</p>

            <form id="formSolicitarRedefinicao" class="auth-form" novalidate>
                <div class="input-group">
                    <label for="identificadorRedefinicao">ID do funcion&aacute;rio</label>
                    <input type="text" id="identificadorRedefinicao" name="identificadorFuncionario" placeholder="CM-000001" autocomplete="username" required>
                </div>

                <div id="mensagemSolicitarRedefinicao" class="message" aria-live="polite"></div>

                <button type="submit" class="btn-primary">Enviar instru&ccedil;&otilde;es</button>
                <a class="text-link" href="index.html">Voltar para login</a>
            </form>
        </section>
    </main>
</body>
</html>
