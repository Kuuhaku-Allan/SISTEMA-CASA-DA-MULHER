<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueci a Senha - Casa da Mulher</title>
    <link rel="stylesheet" href="style.css?v=8">
    <script src="config.js" defer></script>
    <script src="auth.js" defer></script>
    <script src="app.js?v=8" defer></script>
</head>
<body class="soft-auth-page">
    <div class="soft-auth-shell">
        <div class="soft-auth-card">
            <img src="IMAGENS/logo_oficial.png" alt="Logo Casa da Mulher" class="soft-auth-logo">

            <h1 class="soft-auth-title">Esqueci minha senha</h1>
            <p class="soft-auth-subtitle">Informe seu ID de funcion&aacute;rio para receber as instru&ccedil;&otilde;es no e-mail cadastrado.</p>

            <form id="formSolicitarRedefinicao" class="soft-auth-form" novalidate>
                <div class="soft-form-group">
                    <label for="identificadorRedefinicao">ID Institucional</label>
                    <input type="text" id="identificadorRedefinicao" class="soft-input" name="identificador" placeholder="Ex: REC-000001" required>
                </div>
                
                <div class="soft-auth-actions">
                    <button type="submit" class="soft-btn soft-btn-primary">Enviar instru&ccedil;&otilde;es</button>
                </div>
            </form>

            <div id="mensagemSolicitarRedefinicao" class="message soft-auth-message" aria-live="polite"></div>

            <div style="margin-top: 24px;">
                <a href="index.html" class="soft-auth-link">Voltar para o login</a>
            </div>
        </div>
    </div>
</body>
</html>
