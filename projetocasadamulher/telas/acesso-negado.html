<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso restrito - Casa da Mulher</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="auth-shell">
        <section class="auth-card">
            <img src="IMAGENS/logo_oficial.png" alt="Logo Casa da Mulher" class="logo-auth">
            <h1 class="auth-title">Este ambiente é restrito à equipe do projeto Sistema Casa da Mulher.</h1>
            <p class="section-intro">
                Entre com uma conta GitHub autorizada. Se você faz parte da equipe e não conseguiu entrar,
                peça ao mantenedor para verificar sua allowlist ou convite EQP.
            </p>
            <div class="link-list">
                <a class="btn-primary button-link" href="/api/portal-eqp/github/login">Entrar com GitHub</a>
                <a class="btn-secondary button-link" href="/equipe.html">Voltar para Área da Equipe</a>
            </div>
        </section>
    </main>
</body>
</html>
