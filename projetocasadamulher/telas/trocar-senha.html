<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trocar Senha - Casa da Mulher</title>
    <link rel="stylesheet" href="style.css">
    <script src="config.js" defer></script>
    <script src="auth.js" defer></script>
    <script src="app.js" defer></script>
</head>
<body>
    <main class="auth-container">
        <section class="auth-box">
            <img src="IMAGENS/logo_oficial.png" alt="Logo Casa da Mulher" class="logo-login">
            <h1 class="auth-title">Troca de senha</h1>
            <p class="auth-subtitle">Por seguran&ccedil;a, crie uma nova senha antes de continuar.</p>

            <form id="formTrocarSenha" class="auth-form" novalidate>
                <div class="input-group">
                    <label for="senhaAtual">Senha atual</label>
                    <input type="password" id="senhaAtual" autocomplete="current-password" required>
                </div>

                <div class="input-group">
                    <label for="novaSenha">Nova senha</label>
                    <input type="password" id="novaSenha" autocomplete="new-password" required>
                </div>

                <div class="input-group">
                    <label for="confirmarNovaSenha">Confirmar nova senha</label>
                    <input type="password" id="confirmarNovaSenha" autocomplete="new-password" required>
                </div>

                <div id="mensagemTrocarSenha" class="message" aria-live="polite"></div>

                <button type="submit" class="btn-primary">Salvar nova senha</button>
            </form>
            <button type="button" id="btnSairTrocarSenha" class="btn-secondary">Sair</button>
        </section>
    </main>
</body>
</html>
