<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funcionários - Casa da Mulher</title>
    <link rel="stylesheet" href="style.css?v=11">
    <script src="config.js" defer></script>
    <script src="auth.js" defer></script>
    <script src="app.js?v=11" defer></script>
</head>
<body class="soft-page">
    <main id="funcionariosPage" class="soft-admin-main">
        <header class="soft-header">
            <div>
                <h1 class="soft-header-title">Casa da Mulher de Itaquaquecetuba</h1>
                <p class="soft-header-subtitle">Gerenciar funcion&aacute;rios</p>
            </div>
            
            <div class="soft-session-card" id="sessionCard">
                <div class="soft-clock session-trigger" tabindex="0" role="button" aria-haspopup="true" aria-expanded="false" id="sessionTrigger">
                    <div id="currentDate"></div>
                    <div id="currentTime"></div>
                </div>
                
                <div class="session-dropdown" id="sessionDropdown">
                    <div class="session-user-name" id="sessionUserName">-</div>
                    <div class="session-user-role" id="sessionUserRole">-</div>
                    <div class="session-user-meta" id="sessionUserEmail">-</div>
                    <div class="session-user-meta" style="margin-top: 4px;">ID: <span id="sessionUserId">-</span></div>
                    
                    <div class="session-actions">
                        <a class="soft-btn soft-btn-warning" href="painel.html" data-painel-link style="text-decoration:none; flex: 1; justify-content: center;">Voltar</a>
                        <button type="button" id="btnSairFuncionarios" class="soft-btn soft-btn-danger" style="flex: 1; justify-content: center;">Sair</button>
                    </div>
                </div>
            </div>
        </header>

        <section id="funcionariosRestrito" class="admin-alert hidden">
            <h2>Acesso restrito &agrave; coordena&ccedil;&atilde;o</h2>
        </section>

        <section id="funcionariosConteudo" class="soft-admin-stack">
            <div class="soft-card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 12px;">
                    <div>
                        <h2 class="soft-card-title">Funcion&aacute;rios</h2>
                        <p style="color: #8F6C7E; font-size: 0.95rem; margin-top: -4px;">Altere perfil, redefina senha ou desative o acesso quando necess&aacute;rio.</p>
                    </div>
                    <button type="button" id="btnAtualizarFuncionarios" class="soft-action-secondary">Atualizar lista</button>
                </div>
                
                <div id="mensagemFuncionarios" class="message" aria-live="polite"></div>
                
                <div id="listaFuncionarios" class="soft-record-list funcionarios-grid">
                    <div class="soft-empty-state">Carregando funcion&aacute;rios...</div>
                </div>
                
                <div id="funcionariosPagination" class="soft-pagination"></div>
            </div>
        </section>
    </main>
</body>
</html>
