<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Casa da Mulher</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <main class="auth-container">
        <section class="auth-box">
            <img src="IMAGENS/logo_oficial.png" alt="Logo Casa da Mulher" class="logo-login">
            <p class="auth-subtitle">Acolhimento e Qualifica&ccedil;&atilde;o</p>

            <form id="formLogin" class="auth-form" novalidate>
                <div class="input-group">
                    <label for="identificador">ID do funcion&aacute;rio</label>
                    <input type="text" id="identificador" name="identificador" placeholder="CM-000001" autocomplete="username" required>
                </div>

                <div class="input-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="********" autocomplete="current-password" required>
                </div>

                <div id="mensagemLogin" class="message" aria-live="polite"></div>

                <button type="submit" class="btn-primary">Entrar no sistema</button>
            </form>

            <form id="formLogin2fa" class="auth-form hidden" novalidate>
                <div class="input-group">
                    <label for="codigo2fa">C&oacute;digo do Authenticator</label>
                    <input type="text" id="codigo2fa" name="codigo" inputmode="numeric" placeholder="123456" autocomplete="one-time-code" required>
                </div>

                <div id="mensagemLogin2fa" class="message" aria-live="polite"></div>

                <button type="submit" class="btn-primary">Confirmar c&oacute;digo</button>
            </form>

            <a class="text-link" href="cadastro.html">Primeiro acesso com convite</a>
        </section>
    </main>
</body>
</html>
