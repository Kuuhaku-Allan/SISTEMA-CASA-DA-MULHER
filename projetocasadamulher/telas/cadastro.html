<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Casa da Mulher</title>
    <link rel="stylesheet" href="style.css">
    <script src="auth.js" defer></script>
    <script src="app.js" defer></script>
</head>
<body>
    <main class="auth-container">
        <section class="auth-box auth-box-wide">
            <img src="IMAGENS/logo_oficial.png" alt="Logo Casa da Mulher" class="logo-login">
            <h1 class="auth-title">Criar senha de acesso</h1>
            <p class="auth-subtitle">Finalize o convite enviado pela coordena&ccedil;&atilde;o.</p>
            <div id="avisoConvite" class="notice">
                Verificando convite...
            </div>

            <form id="formCadastroFuncionario" class="auth-form hidden" novalidate>
                <div class="input-group">
                    <label for="nomeCompleto">Nome completo</label>
                    <input type="text" id="nomeCompleto" name="nomeCompleto" autocomplete="name" readonly>
                </div>

                <div class="input-grid">
                    <div class="input-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" autocomplete="email" readonly>
                    </div>

                    <div class="input-group">
                        <label for="identificadorFuncionario">ID do funcion&aacute;rio</label>
                        <input type="text" id="identificadorFuncionario" name="identificadorFuncionario" readonly>
                    </div>
                </div>

                <div class="input-grid">
                    <div class="input-group">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" name="senha" placeholder="********" autocomplete="new-password" required>
                    </div>

                    <div class="input-group">
                        <label for="confirmarSenha">Confirmar senha</label>
                        <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="********" autocomplete="new-password" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="codigoCadastro">C&oacute;digo do convite</label>
                    <input type="text" id="codigoCadastro" name="codigoCadastro" readonly>
                </div>

                <p class="hint">Os dados do convite n&atilde;o podem ser alterados nesta tela.</p>

                <div id="mensagemCadastro" class="message" aria-live="polite"></div>

                <button type="submit" class="btn-primary">Criar minha senha e ativar acesso</button>
            </form>

            <a class="text-link" href="index.html">J&aacute; tenho cadastro</a>
        </section>
    </main>
</body>
</html>
