<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ativar EQP - Casa da Mulher</title>
    <link rel="stylesheet" href="style.css">
    <script src="config.js" defer></script>
    <script src="auth.js" defer></script>
    <script src="app.js" defer></script>
</head>
<body>
    <main id="equipeAtivarPage" class="auth-container">
        <section class="auth-box auth-box-wide">
            <img src="IMAGENS/logo_oficial.png" alt="Logo Casa da Mulher" class="logo-login">
            <h1 class="auth-title">Ativar conta da equipe</h1>
            <p class="auth-subtitle">Use o ID EQP e o c&oacute;digo recebidos para criar seu acesso de teste.</p>

            <form id="formEquipeAtivar" class="auth-form" novalidate>
                <div class="input-grid">
                    <div class="input-group">
                        <label for="codigoEquipe">ID EQP</label>
                        <input type="text" id="codigoEquipe" autocomplete="username" placeholder="EQP-000001" maxlength="20" required>
                    </div>

                    <div class="input-group">
                        <label for="codigoAtivacao">C&oacute;digo de ativa&ccedil;&atilde;o</label>
                        <input type="text" id="codigoAtivacao" maxlength="40" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="nomeEquipe">Nome completo</label>
                    <input type="text" id="nomeEquipe" autocomplete="name" maxlength="160" required>
                </div>

                <div class="input-grid">
                    <div class="input-group">
                        <label for="senhaEquipe">Senha</label>
                        <input type="password" id="senhaEquipe" autocomplete="new-password" minlength="8" required>
                    </div>

                    <div class="input-group">
                        <label for="confirmarSenhaEquipe">Confirmar senha</label>
                        <input type="password" id="confirmarSenhaEquipe" autocomplete="new-password" minlength="8" required>
                    </div>
                </div>

                <p class="hint">A senha precisa seguir a pol&iacute;tica do sistema: ao menos 8 caracteres, letra mai&uacute;scula, min&uacute;scula, n&uacute;mero e s&iacute;mbolo.</p>

                <div id="mensagemEquipeAtivar" class="message" aria-live="polite"></div>

                <button type="submit" class="btn-primary">Ativar conta</button>
            </form>

            <a class="text-link" href="index.html">Voltar ao login</a>
        </section>
    </main>
</body>
</html>
