<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recep&ccedil;&atilde;o - Casa da Mulher</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .recepcao-panel {
            display: none;
            animation: fadeIn 0.25s ease;
        }

        .recepcao-panel.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
    <script src="config.js" defer></script>
    <script src="auth.js" defer></script>
    <script src="app.js" defer></script>
    <script defer>
        (function () {
            "use strict";

            const STORAGE_KEY = "casamulher_itaqua";
            let patients = [];
            let usuarioLogado = null;

            async function init() {
                const usuario = await protegerTelaRecepcao();

                if (!usuario) {
                    return;
                }

                document.getElementById("recepcaoNome").textContent = usuario.nomeCompleto || "-";
                document.getElementById("recepcaoPerfil").textContent = formatPerfilLocal(usuario.perfil);
                usuarioLogado = usuario;

                const atendidaPorNomeDisplay = document.getElementById("atendidaPorNomeDisplay");
                const atendidaPorInfoDisplay = document.getElementById("atendidaPorInfoDisplay");
                if (atendidaPorNomeDisplay && atendidaPorInfoDisplay) {
                    atendidaPorNomeDisplay.textContent = usuario.nomeCompleto || "Desconhecido";
                    atendidaPorInfoDisplay.textContent = `${usuario.email} | ID: ${usuario.identificadorFuncionario}`;
                }

                bindEvents();
                updateDateTime();
                setInterval(updateDateTime, 1000);
                await loadData();
                updateDashboard();
                displayPatients();
            }

            async function protegerTelaRecepcao() {
                const usuario = await CasaMulherAuth.protegerPagina();

                if (!usuario) {
                    return null;
                }

                if (!CasaMulherAuth.podeAcessar("recepcao")) {
                    alert("Voc\u00ea n\u00e3o tem permiss\u00e3o para acessar a recep\u00e7\u00e3o.");
                    window.location.href = CasaMulherAuth.getPainelUrl(usuario);
                    return null;
                }

                return usuario;
            }

            function bindEvents() {
                document.getElementById("btnSairRecepcao")?.addEventListener("click", function () {
                    CasaMulherAuth.logout();
                });

                document.querySelectorAll("[data-tab]").forEach(function (button) {
                    button.addEventListener("click", function () {
                        showTab(button.dataset.tab);
                    });
                });

                document.getElementById("patientForm")?.addEventListener("submit", savePatient);
                document.getElementById("btnLimparFormulario")?.addEventListener("click", resetForm);
                document.getElementById("btnBuscarPaciente")?.addEventListener("click", searchPatients);
                document.getElementById("btnMostrarTodas")?.addEventListener("click", resetSearch);

                document.getElementById("searchPatient")?.addEventListener("input", function (event) {
                    displayPatients(event.target.value);
                });

                document.getElementById("cpf")?.addEventListener("input", maskCPF);
                document.getElementById("telefone")?.addEventListener("input", maskPhone);

                document.getElementById("patientsList")?.addEventListener("click", function (event) {
                    const button = event.target.closest("[data-action]");

                    if (!button) {
                        return;
                    }

                    const id = Number(button.dataset.id);

                    if (button.dataset.action === "edit") {
                        editPatient(id);
                    }

                    if (button.dataset.action === "delete") {
                        deletePatient(id);
                    }
                });
            }

            function updateDateTime() {
                const now = new Date();
                document.getElementById("currentDate").textContent = now.toLocaleDateString("pt-BR", {
                    weekday: "long",
                    day: "2-digit",
                    month: "long",
                    year: "numeric"
                });
                document.getElementById("currentTime").textContent = now.toLocaleTimeString("pt-BR");
            }

            async function loadData() {
                try {
                    const stored = localStorage.getItem(STORAGE_KEY);
                    patients = stored ? JSON.parse(stored) : [];

                    if (!Array.isArray(patients)) {
                        patients = [];
                    }

                    if (patients.length === 0) {
                        const response = await CasaMulherAuth.apiFetch("/api/homologacao/recepcao-seed");
                        if (response.ok) {
                            const seed = await response.json();
                            patients = Array.isArray(seed) ? seed.map(function (item) {
                                return Object.assign({}, item, {
                                    cpfClean: String(item.cpf || "").replace(/\D/g, ""),
                                    criadoEm: item.criadoEm || new Date().toISOString(),
                                    atualizadoEm: item.atualizadoEm || new Date().toISOString()
                                });
                            }) : [];
                            if (patients.length > 0) {
                                saveToLocal();
                                showMessage("Dados fictícios de homologação carregados.", "info");
                            }
                        }
                    }
                } catch {
                    patients = [];
                    showMessage("N\u00e3o foi poss\u00edvel carregar os acolhimentos salvos neste navegador.", "error");
                }
            }

            function saveToLocal() {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(patients));
            }

            function maskCPF(event) {
                let value = event.target.value.replace(/\D/g, "");

                if (value.length > 11) {
                    value = value.slice(0, 11);
                }

                value = value.replace(/^(\d{3})(\d)/, "$1.$2");
                value = value.replace(/^(\d{3})\.(\d{3})(\d)/, "$1.$2.$3");
                value = value.replace(/\.(\d{3})(\d)/, ".$1-$2");
                event.target.value = value;
            }

            function maskPhone(event) {
                let value = event.target.value.replace(/\D/g, "");

                if (value.length > 11) {
                    value = value.slice(0, 11);
                }

                if (value.length <= 10) {
                    value = value.replace(/^(\d{2})(\d)/, "($1) $2");
                    value = value.replace(/(\d{4})(\d{1,4})$/, "$1-$2");
                } else {
                    value = value.replace(/^(\d{2})(\d)/, "($1) $2");
                    value = value.replace(/(\d{5})(\d{1,4})$/, "$1-$2");
                }

                event.target.value = value;
            }

            function validarCPF(cpf) {
                const clean = String(cpf || "").replace(/\D/g, "");

                if (clean.length !== 11) {
                    return false;
                }

                if (/^(\d)\1{10}$/.test(clean)) {
                    return false;
                }

                let soma = 0;

                for (let i = 0; i < 9; i += 1) {
                    soma += Number(clean[i]) * (10 - i);
                }

                let digito1 = (soma * 10) % 11;
                digito1 = digito1 === 10 ? 0 : digito1;

                if (digito1 !== Number(clean[9])) {
                    return false;
                }

                soma = 0;

                for (let i = 0; i < 10; i += 1) {
                    soma += Number(clean[i]) * (11 - i);
                }

                let digito2 = (soma * 10) % 11;
                digito2 = digito2 === 10 ? 0 : digito2;

                return digito2 === Number(clean[10]);
            }

            function savePatient(event) {
                event.preventDefault();

                const form = event.currentTarget;

                if (!form.reportValidity()) {
                    return;
                }

                const id = document.getElementById("patientId").value;
                const nome = document.getElementById("nome").value.trim();
                const cpfRaw = document.getElementById("cpf").value.trim();
                const cpfClean = cpfRaw.replace(/\D/g, "");
                const telefone = document.getElementById("telefone").value.trim();
                const dataNascimento = document.getElementById("dataNascimento").value;
                const curso = document.getElementById("curso").value;
                const emailAssistida = document.getElementById("email").value.trim();
                const endereco = document.getElementById("endereco").value.trim();
                const enderecoNumero = document.getElementById("enderecoNumero").value.trim();
                const observacoes = document.getElementById("observacoes").value.trim();

                if (!validarCPF(cpfClean)) {
                    showMessage("CPF inv\u00e1lido. Confira os n\u00fameros informados.", "error");
                    return;
                }

                const existingPatient = patients.find(function (patient) {
                    return patient.cpfClean === cpfClean && (!id || String(patient.id) !== String(id));
                });

                if (existingPatient) {
                    showMessage("Já existe uma mulher atendida com este CPF. O cadastro duplicado foi bloqueado.", "error");
                    return;
                }

                const previous = id ? patients.find(function (patient) {
                    return String(patient.id) === String(id);
                }) : null;

                const patientData = {
                    id: id ? Number(id) : Date.now(),
                    nome,
                    cpf: cpfRaw,
                    cpfClean,
                    telefone,
                    dataNascimento,
                    curso,
                    emailAssistida: emailAssistida,
                    email: previous?.email || emailAssistida, // mantém compatibilidade
                    endereco,
                    enderecoNumero,
                    funcionarioAtendimentoId: usuarioLogado?.identificadorFuncionario || previous?.funcionarioAtendimentoId,
                    funcionarioAtendimentoNomeSnapshot: usuarioLogado?.nomeCompleto || previous?.funcionarioAtendimentoNomeSnapshot,
                    funcionarioAtendimentoEmailSnapshot: usuarioLogado?.email || previous?.funcionarioAtendimentoEmailSnapshot,
                    atendido: previous?.atendido || usuarioLogado?.nomeCompleto, // fallback legado
                    observacoes,
                    criadoEm: previous?.criadoEm || new Date().toISOString(),
                    atualizadoEm: new Date().toISOString()
                };

                if (id) {
                    const index = patients.findIndex(function (patient) {
                        return String(patient.id) === String(id);
                    });

                    if (index !== -1) {
                        patients[index] = patientData;
                    }

                    showMessage("Acolhimento atualizado.", "success");
                } else {
                    patients.push(patientData);
                    showMessage("Acolhimento registrado.", "success");
                }

                saveToLocal();
                updateDashboard();
                displayPatients();
                resetForm();
                showTab("patients");
            }

            function displayPatients(searchTerm) {
                const tbody = document.getElementById("patientsList");

                if (!tbody) {
                    return;
                }

                const term = String(searchTerm || "").trim().toLowerCase();
                
                // Remove acentos para a busca
                const removeAcentos = (str) => str.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                const termSemAcento = removeAcentos(term);
                
                const filtered = term
                    ? patients.filter(function (patient) {
                        const termSomenteDigitos = term.replace(/\D/g, "");
                        const temLetras = /[a-z]/i.test(termSemAcento);
                        
                        // Busca Parcial ou Exata por CPF/Telefone
                        if (!temLetras && termSomenteDigitos.length >= 3) {
                            // Se for CPF completo válido, checa exato
                            if (termSomenteDigitos.length === 11 && validarCPF(termSomenteDigitos)) {
                                if (patient.cpfClean === termSomenteDigitos) return true;
                            }
                            
                            // Busca parcial em CPF ou Telefone
                            const cpfStr = String(patient.cpfClean || "").replace(/\D/g, "");
                            const telStr = String(patient.telefone || "").replace(/\D/g, "");
                            if (cpfStr.includes(termSomenteDigitos) || telStr.includes(termSomenteDigitos)) {
                                return true;
                            }
                        } else if (!temLetras && termSomenteDigitos.length > 0 && termSomenteDigitos.length < 3) {
                            // Omitir busca numérica muito curta para não explodir resultados
                            return false;
                        }
                        
                        // Busca por Nome
                        const patientName = removeAcentos(String(patient.nome || "").toLowerCase());
                        return patientName.includes(termSemAcento);
                    })
                    : patients;

                if (filtered.length === 0) {
                    tbody.innerHTML = "<div class=\"soft-empty-state\">Nenhum acolhimento encontrado.</div>";
                    return;
                }

                tbody.innerHTML = filtered.map(function (patient) {
                    const emailExibir = patient.emailAssistida || patient.email;
                    const atendenteExibir = patient.funcionarioAtendimentoNomeSnapshot || patient.atendido || "-";
                    const funcionarioEmail = patient.funcionarioAtendimentoEmailSnapshot || "";
                    
                    let enderecoExibir = "Não informado";
                    if (patient.endereco) {
                        enderecoExibir = patient.endereco;
                        if (patient.enderecoNumero) {
                            enderecoExibir += `, ${patient.enderecoNumero}`;
                        }
                    }

                    // Mascarar CPF: 123.456.789-00 vira ***.456.789-** ou similar.
                    let cpfMascarado = "---";
                    if (patient.cpfClean && patient.cpfClean.length === 11) {
                        cpfMascarado = "***." + patient.cpfClean.substring(3, 6) + "." + patient.cpfClean.substring(6, 9) + "-**";
                    }

                    return `
                        <div class="entity-card">
                            <div class="entity-title">${escapeHtmlValue(patient.nome)}</div>
                            <div class="entity-info">CPF: ${escapeHtmlValue(cpfMascarado)}</div>
                            <div class="entity-info">Telefone: ${escapeHtmlValue(patient.telefone || "-")}</div>
                            <div class="entity-info">Nascimento: ${escapeHtmlValue(formatDateLocal(patient.dataNascimento))}</div>
                            <div class="entity-info">Endereço: ${escapeHtmlValue(enderecoExibir)}</div>
                            <div class="entity-info">Curso: ${escapeHtmlValue(patient.curso || "A definir")}</div>
                            ${emailExibir ? `<div class="entity-info">E-mail: ${escapeHtmlValue(emailExibir)}</div>` : ""}
                            <div class="entity-info">Atendida por: ${escapeHtmlValue(atendenteExibir)}</div>
                            ${funcionarioEmail ? `<div class="entity-info">E-mail institucional: ${escapeHtmlValue(funcionarioEmail)}</div>` : ""}
                            
                            <div class="entity-actions">
                                <button type="button" class="soft-btn soft-btn-warning" data-action="edit" data-id="${patient.id}">Editar</button>
                                <button type="button" class="soft-btn soft-btn-danger" data-action="delete" data-id="${patient.id}">Remover</button>
                            </div>
                        </div>
                    `;
                }).join("");
            }

            function editPatient(id) {
                const patient = patients.find(function (item) {
                    return Number(item.id) === Number(id);
                });

                if (!patient) {
                    return;
                }

                document.getElementById("patientId").value = patient.id;
                document.getElementById("nome").value = patient.nome || "";
                document.getElementById("cpf").value = patient.cpf || "";
                document.getElementById("telefone").value = patient.telefone || "";
                document.getElementById("dataNascimento").value = patient.dataNascimento || "";
                document.getElementById("curso").value = patient.curso || "";
                document.getElementById("email").value = patient.emailAssistida || patient.email || "";
                document.getElementById("endereco").value = patient.endereco || "";
                document.getElementById("enderecoNumero").value = patient.enderecoNumero || "";
                document.getElementById("observacoes").value = patient.observacoes || "";

                document.getElementById("formTitle").textContent = "Editar acolhimento";
                document.getElementById("submitLabel").textContent = "Salvar alteracoes";
                    showMessage("Altere os dados necess\u00e1rios e salve.", "info");
                showTab("register");
            }

            function deletePatient(id) {
                if (!confirm("Remover este registro de acolhimento?")) {
                    return;
                }

                patients = patients.filter(function (patient) {
                    return Number(patient.id) !== Number(id);
                });

                saveToLocal();
                updateDashboard();
                displayPatients(document.getElementById("searchPatient")?.value || "");
                showMessage("Registro removido.", "success");
            }

            function searchPatients() {
                displayPatients(document.getElementById("searchPatient").value);
                showTab("patients");
            }

            function resetSearch() {
                document.getElementById("searchPatient").value = "";
                displayPatients("");
            }

            function updateDashboard() {
                document.getElementById("totalPatients").textContent = String(patients.length);
                document.getElementById("totalCourses").textContent = String(patients.filter(function (patient) {
                    return patient.curso && patient.curso.trim() !== "";
                }).length);

                const uniqueCourses = new Set();
                patients.forEach(function (patient) {
                    if (patient.curso && patient.curso.trim()) {
                        uniqueCourses.add(patient.curso);
                    }
                });
                document.getElementById("activeEnrollments").textContent = String(uniqueCourses.size);
            }

            function resetForm() {
                document.getElementById("patientForm").reset();
                document.getElementById("patientId").value = "";
                document.getElementById("formTitle").textContent = "Novo acolhimento";
                document.getElementById("submitLabel").textContent = "Salvar acolhimento";
            }

            function showTab(tabName) {
                document.querySelectorAll("[data-tab]").forEach(function (button) {
                    button.classList.toggle("active", button.dataset.tab === tabName);
                });

                document.querySelectorAll("[data-panel]").forEach(function (panel) {
                    panel.classList.toggle("active", panel.dataset.panel === tabName);
                });

                if (tabName === "dashboard") {
                    updateDashboard();
                }

                if (tabName === "patients") {
                    displayPatients(document.getElementById("searchPatient")?.value || "");
                }
            }

            function showMessage(text, type) {
                const message = document.getElementById("mensagemRecepcao");

                if (!message) {
                    return;
                }

                message.textContent = text;
                message.className = `message ${type || ""}`.trim();
            }

            function escapeHtmlValue(value) {
                return String(value || "")
                    .replaceAll("&", "&amp;")
                    .replaceAll("<", "&lt;")
                    .replaceAll(">", "&gt;")
                    .replaceAll('"', "&quot;")
                    .replaceAll("'", "&#039;");
            }

            function formatDateLocal(dateString) {
                if (!dateString) {
                    return "-";
                }

                const parts = String(dateString).split("-");

                if (parts.length !== 3) {
                    return dateString;
                }

                return `${parts[2]}/${parts[1]}/${parts[0]}`;
            }

            function formatPerfilLocal(perfil) {
                const labels = {
                    adm: "Coordena\u00e7\u00e3o / ADM",
                    recepcao: "Recep\u00e7\u00e3o",
                    professor: "Professor",
                    as_social: "Assistente Social",
                    juridico: "Jur\u00eddico",
                    equipe: "Equipe do projeto"
                };

                return labels[perfil] || perfil || "-";
            }

            document.addEventListener("DOMContentLoaded", init);
        })();
    </script>
</head>
<body class="soft-page">
    <main id="recepcaoPage" style="max-width: 1400px; margin: 0 auto; padding: 24px 20px;">
        <header class="soft-header">
            <div>
                <h1 class="soft-header-title">Casa da Mulher de Itaquaquecetuba</h1>
                <p class="soft-header-subtitle">Recep&ccedil;&atilde;o &middot; Registro inicial de acolhimentos e gest&atilde;o de atendimentos</p>
            </div>
            <div class="soft-clock">
                <div id="currentDate"></div>
                <div id="currentTime"></div>
            </div>
            <div style="display:flex; gap:10px; margin-top: 10px; width: 100%; justify-content: flex-end;">
                <a class="soft-btn soft-btn-warning" href="painel.html" data-painel-link style="text-decoration:none; color:#B47B94;">Voltar</a>
                <button type="button" id="btnSairRecepcao" class="soft-btn soft-btn-danger">Sair</button>
            </div>
        </header>

        <section class="recepcao-layout">
            <div class="soft-tabs" aria-label="Se&ccedil;&otilde;es da recep&ccedil;&atilde;o">
                <button type="button" class="soft-tab active" data-tab="dashboard">Painel de Apoio</button>
                <button type="button" class="soft-tab" data-tab="patients">Mulheres atendidas</button>
                <button type="button" class="soft-tab" data-tab="register">Novo acolhimento</button>
            </div>

            <div id="mensagemRecepcao" aria-live="polite"></div>

            <section class="recepcao-panel active" data-panel="dashboard">
                <div class="soft-card" style="width: 100%;">
                    <h2 class="soft-card-title">Indicadores</h2>
                    <div class="soft-stat-grid">
                        <div class="soft-stat-card">
                            <span id="totalPatients" class="stat-number">0</span>
                            <span class="stat-label">Mulheres acolhidas</span>
                        </div>
                        <div class="soft-stat-card">
                            <span id="totalCourses" class="stat-number">0</span>
                            <span class="stat-label">Com curso/oficina</span>
                        </div>
                        <div class="soft-stat-card">
                            <span id="activeEnrollments" class="stat-number">0</span>
                            <span class="stat-label">Cursos diferentes</span>
                        </div>
                    </div>
                </div>
            </section>

            <section class="recepcao-panel" data-panel="patients">
                <div class="soft-card" style="width: 100%;">
                    <h2 class="soft-card-title">Mulheres atendidas</h2>
                    
                    <div style="display: flex; gap: 12px; margin-bottom: 28px; flex-wrap: wrap;">
                        <input type="text" id="searchPatient" class="soft-input" placeholder="Buscar por nome, CPF ou telefone" style="flex: 1; background: #FFFBFD;">
                        <button type="button" id="btnBuscarPaciente" class="soft-btn soft-btn-primary">Buscar</button>
                        <button type="button" id="btnMostrarTodas" class="soft-btn soft-btn-warning">Mostrar todas</button>
                    </div>

                    <div id="patientsList" class="entity-grid"></div>
                </div>
            </section>

            <section class="recepcao-panel" data-panel="register">
                <div class="soft-card" style="width: 100%;">
                    <h2 id="formTitle" class="soft-card-title">Novo acolhimento</h2>

                    <form id="patientForm">
                        <input type="hidden" id="patientId">

                        <div class="soft-form-row">
                            <div class="soft-form-group">
                                <label for="nome">Nome completo *</label>
                                <input type="text" id="nome" class="soft-input" autocomplete="name" placeholder="Ex: Ana Maria da Silva" required>
                            </div>
                            <div class="soft-form-group">
                                <label for="cpf">CPF *</label>
                                <input type="text" id="cpf" class="soft-input" inputmode="numeric" placeholder="000.000.000-00" required>
                            </div>
                        </div>

                        <div class="soft-form-row">
                            <div class="soft-form-group">
                                <label for="telefone">Telefone *</label>
                                <input type="tel" id="telefone" class="soft-input" autocomplete="tel" placeholder="(11) 99999-9999" required>
                            </div>
                            <div class="soft-form-group">
                                <label for="dataNascimento">Data de nascimento *</label>
                                <input type="date" id="dataNascimento" class="soft-input" required>
                            </div>
                        </div>

                        <div class="soft-form-row">
                            <div class="soft-form-group">
                                <label for="endereco">Endere&ccedil;o</label>
                                <input type="text" id="endereco" class="soft-input" autocomplete="street-address" placeholder="Rua, Bairro - Itaquá">
                            </div>
                            <div class="soft-form-group">
                                <label for="enderecoNumero">N&ordm; / Complemento</label>
                                <input type="text" id="enderecoNumero" class="soft-input" placeholder="Ex: 123, S/N, Apto...">
                            </div>
                        </div>

                        <div class="soft-form-row">
                            <div class="soft-form-group" style="background: #f8fbfa; border: 1px solid var(--color-border); padding: 12px; border-radius: 1.2rem;">
                                <label style="margin-bottom: 4px;">Atendida por</label>
                                <div id="atendidaPorNomeDisplay" style="font-weight: 600; color: #8F6C7E; font-size: 1.05rem;">-</div>
                                <div id="atendidaPorInfoDisplay" style="font-size: 0.85rem; color: #666; margin-top: 2px;">-</div>
                            </div>
                            <div class="soft-form-group">
                                <label for="curso">Curso / oficina</label>
                                <select id="curso" class="soft-input">
                                    <option value="">A definir</option>
                                    <option value="Informatica">Inform&aacute;tica e Inclus&atilde;o Digital</option>
                                    <option value="Culinaria">Culin&aacute;ria e Autonomia</option>
                                    <option value="Estetica">Est&eacute;tica e Autoestima</option>
                                    <option value="Primeiros Socorros">Primeiros Socorros</option>
                                    <option value="Danca">Dan&ccedil;a Circular</option>
                                    <option value="Pilates">Pilates e Bem-estar</option>
                                    <option value="Empoderamento">Empoderamento Feminino</option>
                                </select>
                            </div>
                        </div>

                        <div class="soft-form-row">
                            <div class="soft-form-group">
                                <label for="email">E-mail da assistida &mdash; opcional</label>
