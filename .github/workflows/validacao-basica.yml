name: Validacao basica

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    name: API .NET
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restaurar pacotes
        run: dotnet restore CasaMulher.Api/CasaMulher.Api.csproj

      - name: Compilar API
        run: dotnet build CasaMulher.Api/CasaMulher.Api.csproj --configuration Release --no-restore

  frontend:
    name: Sintaxe do front-end
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Checar arquivos JavaScript
        run: |
          node --check projetocasadamulher/telas/config.js
          node --check projetocasadamulher/telas/auth.js
          node --check projetocasadamulher/telas/app.js
          node --check scripts/validar-regras-eqp.mjs
          node --check scripts/validar-html-inline.mjs

      - name: Checar scripts Codespaces
        shell: bash
        run: |
          bash -n scripts/codespaces/setup.sh
          bash -n scripts/codespaces/start.sh
          bash -n scripts/codespaces/seed.sh
          bash -n scripts/codespaces/detectar-fluxo.sh
          bash -n scripts/codespaces/novo-prototipo.sh
          bash -n scripts/codespaces/enviar-pr.sh

      - name: Checar scripts inline dos HTMLs
        run: node scripts/validar-html-inline.mjs .
